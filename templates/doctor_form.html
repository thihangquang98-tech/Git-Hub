<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    {% if mode == "add" %}
        <title>Thêm bác sĩ</title>
    {% else %}
        <title>Sửa bác sĩ</title>
    {% endif %}


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #1f4e79;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1f6feb;
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        a {
            padding: 11px 18px;
            border-radius: 7px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-save {
            background: #198754;
            color: white;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        {% if mode == "add" %}

            <h1>➕ Thêm bác sĩ</h1>

        {% else %}

            <h1>✏️ Cập nhật bác sĩ</h1>

        {% endif %}


        {% if error %}

            <div class="error">
                ⚠️ {{ error }}
            </div>

        {% endif %}


        <form method="POST">


            <!-- MÃ BÁC SĨ -->

            <div class="form-group">

                <label>
                    Mã bác sĩ *
                </label>

                <input
                    type="text"
                    name="doctor_code"
                    required
                    placeholder="Ví dụ: BS004"
                    value="{% if doctor %}{{ doctor[1] }}{% endif %}"
                >

            </div>


            <!-- HỌ TÊN -->

            <div class="form-group">

                <label>
                    Họ và tên *
                </label>

                <input
                    type="text"
                    name="full_name"
                    required
                    placeholder="Nhập họ tên bác sĩ"
                    value="{% if doctor %}{{ doctor[2] }}{% endif %}"
                >

            </div>


            <!-- CHUYÊN KHOA -->

            <div class="form-group">

                <label>
                    Chuyên khoa
                </label>

                <input
                    type="text"
                    name="specialty"
                    placeholder="Ví dụ: Nha khoa tổng quát"
                    value="{% if doctor %}{{ doctor[3] }}{% endif %}"
                >

            </div>


            <!-- SỐ ĐIỆN THOẠI -->

            <div class="form-group">

                <label>
                    Số điện thoại
                </label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Nhập số điện thoại"
                    value="{% if doctor %}{{ doctor[4] }}{% endif %}"
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="doctor@example.com"
                    value="{% if doctor %}{{ doctor[5] }}{% endif %}"
                >

            </div>


            <!-- BUTTON -->

            <div class="buttons">

                <button
                    type="submit"
                    class="btn-save"
                >
                    💾 Lưu bác sĩ
                </button>


                <a
                    href="{{ url_for('doctors') }}"
                    class="btn-cancel"
                >
                    Hủy
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
